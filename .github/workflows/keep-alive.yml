name: Keep backend warm

# Render's free tier spins the service down after ~15 minutes of no
# traffic; the next real request then pays a 30-60s cold-start penalty
# (this is the actual cause behind "Travel Date takes too long to load" —
# the first API call after any idle period, not the query itself). Pinging
# /health well inside that window keeps it warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf --max-time 20 https://flyingleadersserver.onrender.com/health
