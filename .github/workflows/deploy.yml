name: Production Deploy

on:
  push:
    branches: ["main"]

  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Workspace
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          ls -la

      - name: Copy Production Environment
        run: |
          cp ~/actions-runner/_work/.env "$GITHUB_WORKSPACE/.env"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Start or Restart PM2
        run: |
          if pm2 describe flying-leader-server > /dev/null 2>&1; then
            pm2 restart flying-leader-server --update-env
          else
            pm2 start dist/server.js --name flying-leader-server
          fi

      - name: Save PM2
        run: pm2 save

      - name: Verify Deployment
        run: |
          pm2 status
          pm2 describe flying-leader-server
