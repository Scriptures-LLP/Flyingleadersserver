services:
  - type: web
    name: flying-leader-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4001
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_CUSTOMER_EXPIRES_IN
        value: 30d
      - key: JWT_ADMIN_EXPIRES_IN
        value: 8h
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: UPLOAD_ROOT
        value: ./uploads
      - key: PUBLIC_UPLOAD_BASE_URL
        value: https://flying-leader-server.onrender.com/uploads
      - key: CORS_ORIGINS
        value: "*"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # MySQL sync stays off here — this deployment doesn't have network access
      # to flyingdotcom's MySQL. It gets enabled once co-located on Flying
      # Leader's own server, per the contract's hosting arrangement.
      - key: MYSQL_SYNC_ENABLED
        value: false
      - key: LLM_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
      # S3 now backs every uploaded image (tours/countries/categories/gallery/
      # home covers/avatars) — Render's own disk is wiped on every restart, so
      # local storage silently lost every uploaded file.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_KEY_PREFIX
        value: flying-leader
      # This bucket has ACLs disabled (BucketOwnerEnforced) with a public-read
      # bucket policy instead — sending an ACL on PutObject would error, so
      # this must stay empty here too.
      - key: AWS_S3_ACL
        value: ""
